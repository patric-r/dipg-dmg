<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Redirecting to DIPG &amp; DMG Research Dashboard</title>
    
    <!-- Automatic redirect after 2 seconds -->
    <meta http-equiv="refresh" content="2; url=https://dipg-dmg.org/">
    <link rel="canonical" href="https://dipg-dmg.org/">
    <meta name="robots" content="noindex, follow">

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #111c33;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .redirect-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 2.5rem 2rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 35px -5px rgba(0, 0, 0, 0.5), 0 0 15px var(--accent-glow);
        }

        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(56, 189, 248, 0.2);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1.5rem auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.75rem;
            color: var(--text-main);
            line-height: 1.3;
        }

        p {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }

        .redirect-btn {
            display: inline-block;
            background-color: var(--accent-blue);
            color: #0b1120;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .redirect-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .url-text {
            display: block;
            margin-top: 1.25rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <div class="spinner" aria-hidden="true"></div>
        <h1>Dashboard Moved to Official Domain</h1>
        <p>
            The private beta is now live on our permanent home.<br>
            Redirecting automatically in <span id="countdown">2</span> seconds...
        </p>
        <a href="https://dipg-dmg.org/" class="redirect-btn">Go to dipg-dmg.org ↗</a>
        <span class="url-text">Destination: https://dipg-dmg.org/</span>
    </div>

    <script>
        let timeLeft = 2;
        const countdownElem = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            timeLeft--;
            if (countdownElem) {
                countdownElem.textContent = timeLeft;
            }
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.replace("https://dipg-dmg.org/");
            }
        }, 1000);
    </script>
</body>
</html>
