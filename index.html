<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Redirecting to DIPG/DMG Research Dashboard</title>
    
    <!-- Automatic redirect after 5 seconds -->
    <meta http-equiv="refresh" content="5; url=https://dipg-dmg.org/">
    <link rel="canonical" href="https://dipg-dmg.org/">
    <meta name="robots" content="noindex, follow">

    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #111c33;
            --border-color: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
        }

        .redirect-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 3rem 2.5rem;
            max-width: 580px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 35px -5px rgba(0, 0, 0, 0.5), 0 0 25px var(--accent-glow);
        }

        .notice-text {
            font-size: 1.25rem;
            color: var(--text-muted);
            margin-bottom: 1.75rem;
            line-height: 1.4;
        }

        .main-link {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent-blue);
            font-size: 1.6rem;
            font-weight: 700;
            text-decoration: none;
            padding: 1.1rem 2.2rem;
            border-radius: 12px;
            border: 1px solid var(--accent-blue);
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(56, 189, 248, 0.15);
        }

        .main-link:hover {
            background: var(--accent-blue);
            color: #0b1120;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.35);
        }

        .redirect-timer {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <div class="redirect-card">
        <p class="notice-text">DIPG/DMG Research Dashboard is now live on:</p>
        
        <a href="https://dipg-dmg.org/" class="main-link">https://dipg-dmg.org ↗</a>
        
        <p class="redirect-timer">
            Redirecting automatically in <span id="countdown">5</span> seconds...
        </p>
    </div>

    <script>
        let timeLeft = 5;
        const countdownElem = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            timeLeft--;
            if (countdownElem) {
                countdownElem.textContent = timeLeft;
            }
            if (timeLeft <= 0) {
                clearInterval(timer);
                window.location.replace("https://dipg-dmg.org/");
            }
        }, 1000);
    </script>
</body>
</html>
